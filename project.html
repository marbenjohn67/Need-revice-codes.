<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Barangay Services Request Tracker</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        float: "float 6s ease-in-out infinite",
                        floatSlow: "floatSlow 9s ease-in-out infinite",
                        pulseGlow: "pulseGlow 2s ease-in-out infinite",
                        slideUp: "slideUp 0.8s ease-out",
                        fadeIn: "fadeIn 1s ease-out"
                    },

                    keyframes: {
                        float: {
                            "0%, 100%": {
                                transform: "translateY(0px)"
                            },
                            "50%": {
                                transform: "translateY(-25px)"
                            }
                        },

                        floatSlow: {
                            "0%, 100%": {
                                transform: "translateY(0px) rotate(0deg)"
                            },
                            "50%": {
                                transform: "translateY(-40px) rotate(180deg)"
                            }
                        },

                        pulseGlow: {
                            "0%, 100%": {
                                boxShadow: "0 0 0px rgba(34,197,94,0.3)"
                            },
                            "50%": {
                                boxShadow: "0 0 30px rgba(34,197,94,0.7)"
                            }
                        },

                        slideUp: {
                            "0%": {
                                opacity: "0",
                                transform: "translateY(40px)"
                            },
                            "100%": {
                                opacity: "1",
                                transform: "translateY(0)"
                            }
                        },

                        fadeIn: {
                            "0%": {
                                opacity: "0"
                            },
                            "100%": {
                                opacity: "1"
                            }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        /* Glass effect */
        .glass {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Login card 3D transformation */
        .login-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            transform-style: preserve-3d;
        }

        .login-card:hover {
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        }

        /* Input animation */
        .input-field {
            transition: all 0.3s ease;
        }

        .input-field:focus {
            transform: translateY(-2px);
        }

        /* Button transformation */
        .login-button {
            transition: all 0.3s ease;
        }

        .login-button:hover {
            transform: translateY(-3px) scale(1.02);
        }

        .login-button:active {
            transform: scale(0.97);
        }

        /* Background */
        .background {
            background:
                radial-gradient(
                    circle at top left,
                    rgba(34, 197, 94, 0.35),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(16, 185, 129, 0.25),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #052e16,
                    #064e3b,
                    #022c22
                );
        }
    </style>
</head>

<body class="min-h-screen background overflow-hidden">

    <!-- Animated Background Shapes -->

    <div class="absolute w-72 h-72 bg-green-400/20 rounded-full blur-3xl
                -top-20 -left-20 animate-float"></div>

    <div class="absolute w-96 h-96 bg-emerald-400/10 rounded-full blur-3xl
                -bottom-40 -right-20 animate-floatSlow"></div>

    <div class="absolute w-40 h-40 border border-green-300/20
                rounded-3xl rotate-45 top-20 right-20 animate-floatSlow"></div>

    <div class="absolute w-20 h-20 border border-white/10
                rounded-full bottom-24 left-20 animate-float"></div>


    <!-- Main Container -->

    <main class="relative min-h-screen flex items-center justify-center px-5 py-10">

        <!-- Login Card -->

        <section
            id="loginCard"
            class="login-card glass w-full max-w-md rounded-3xl p-8 md:p-10
                   shadow-2xl animate-slideUp"
        >

            <!-- Logo -->

            <div class="flex justify-center mb-6">

                <div
                    class="w-24 h-24 rounded-full
                           bg-gradient-to-br from-green-400 to-emerald-700
                           flex items-center justify-center
                           shadow-lg animate-pulseGlow"
                >

                    <!-- Barangay Icon -->

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="w-12 h-12 text-white"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="1.7"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-7h6v7M8 9h.01M12 9h.01M16 9h.01"
                        />
                    </svg>

                </div>

            </div>


            <!-- Title -->

            <div class="text-center mb-8">

                <h1 class="text-2xl md:text-3xl font-bold text-white">
                    Barangay Services
                </h1>

                <h2 class="text-xl font-semibold text-green-300 mt-1">
                    Request Tracker
                </h2>

                <p class="text-gray-300 text-sm mt-3">
                    Manage and track your barangay service requests easily.
                </p>

            </div>


            <!-- Login Form -->

            <form id="loginForm" class="space-y-5">

                <!-- Username -->

                <div>

                    <label
                        for="username"
                        class="block text-sm font-medium text-gray-200 mb-2"
                    >
                        Username
                    </label>

                    <div class="relative">

                        <span
                            class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
                        >
                            👤
                        </span>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            class="input-field w-full pl-12 pr-4 py-3
                                   bg-white/10 border border-white/20
                                   rounded-xl text-white
                                   placeholder-gray-400
                                   outline-none
                                   focus:border-green-400
                                   focus:ring-2 focus:ring-green-400/30"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->

                <div>

                    <label
                        for="password"
                        class="block text-sm font-medium text-gray-200 mb-2"
                    >
                        Password
                    </label>

                    <div class="relative">

                        <span
                            class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
                        >
                            🔒
                        </span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            class="input-field w-full pl-12 pr-12 py-3
                                   bg-white/10 border border-white/20
                                   rounded-xl text-white
                                   placeholder-gray-400
                                   outline-none
                                   focus:border-green-400
                                   focus:ring-2 focus:ring-green-400/30"
                            autocomplete="current-password"
                            required
                        >

                        <!-- Show Password -->

                        <button
                            type="button"
                            id="togglePassword"
                            class="absolute right-4 top-1/2
                                   -translate-y-1/2
                                   text-gray-400 hover:text-white
                                   transition"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- Remember + Forgot -->

                <div class="flex items-center justify-between text-sm">

                    <label class="flex items-center gap-2 text-gray-300">

                        <input
                            type="checkbox"
                            id="remember"
                            class="w-4 h-4 accent-green-500"
                        >

                        Remember me

                    </label>

                    <a
                        href="#"
                        id="forgotPassword"
                        class="text-green-300 hover:text-green-200
                               transition"
                    >
                        Forgot Password?
                    </a>

                </div>


                <!-- Error / Success Message -->

                <div
                    id="message"
                    class="hidden text-sm text-center rounded-xl p-3"
                ></div>


                <!-- Login Button -->

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button w-full py-3.5
                           bg-gradient-to-r from-green-500
                           to-emerald-600
                           hover:from-green-400
                           hover:to-emerald-500
                           text-white font-bold
                           rounded-xl shadow-lg
                           flex items-center justify-center gap-2"
                >

                    <span id="buttonText">
                        Login
                    </span>

                    <span id="loadingSpinner" class="hidden">
                        ⏳
                    </span>

                </button>

            </form>


            <!-- Footer -->

            <div class="text-center mt-8">

                <p class="text-gray-400 text-xs">
                    © 2026 Barangay Services Request Tracker
                </p>

                <p class="text-gray-500 text-xs mt-1">
                    Secure • Fast • Accessible
                </p>

            </div>

        </section>

    </main>


    <!-- Separate JavaScript -->

    <script src="project.js"></script>

</body>
</html>
